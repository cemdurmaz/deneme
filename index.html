<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sadece 4 işlem (Toplama, Çıkarma, Çarpma, Bölme) yapabilen modern, şık ve interaktif hesap makinesi uygulaması.">
  <title>4 İşlem Hesap Makinesi | Modern & Görsel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="calculator-wrapper">
    <header class="app-header">
      <div class="brand">
        <span class="badge">PYTHON 4 İŞLEM</span>
        <h1 class="title">Hesap Makinesi</h1>
      </div>
      <button id="history-toggle-btn" class="icon-btn" title="Geçmişi Göster / Gizle" aria-label="Geçmiş">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </button>
    </header>

    <!-- Hesap Makinesi Gövdesi -->
    <section class="calculator-card" id="calculator">
      <!-- Ekran Alanı -->
      <div class="display-container" id="display-container">
        <div class="expression-line" id="expression-display">&nbsp;</div>
        <div class="result-line-wrapper">
          <span class="operation-indicator" id="current-op-indicator"></span>
          <div class="result-line" id="result-display">0</div>
        </div>
      </div>

      <!-- Tuş Takımı -->
      <div class="keypad" id="keypad">
        <!-- Satır 1 -->
        <button type="button" class="key key-action key-clear" id="key-clear" data-action="clear">C</button>
        <button type="button" class="key key-action key-backspace" id="key-backspace" data-action="backspace" title="Geri Al">⌫</button>
        <button type="button" class="key key-action key-sign" id="key-sign" data-action="toggle-sign" title="İşaret Değiştir">±</button>
        <button type="button" class="key key-operator" id="key-divide" data-op="/" title="Bölme">÷</button>

        <!-- Satır 2 -->
        <button type="button" class="key key-num" id="key-7" data-num="7">7</button>
        <button type="button" class="key key-num" id="key-8" data-num="8">8</button>
        <button type="button" class="key key-num" id="key-9" data-num="9">9</button>
        <button type="button" class="key key-operator" id="key-multiply" data-op="*" title="Çarpma">×</button>

        <!-- Satır 3 -->
        <button type="button" class="key key-num" id="key-4" data-num="4">4</button>
        <button type="button" class="key key-num" id="key-5" data-num="5">5</button>
        <button type="button" class="key key-num" id="key-6" data-num="6">6</button>
        <button type="button" class="key key-operator" id="key-subtract" data-op="-" title="Çıkarma">−</button>

        <!-- Satır 4 -->
        <button type="button" class="key key-num" id="key-1" data-num="1">1</button>
        <button type="button" class="key key-num" id="key-2" data-num="2">2</button>
        <button type="button" class="key key-num" id="key-3" data-num="3">3</button>
        <button type="button" class="key key-operator" id="key-add" data-op="+" title="Toplama">+</button>

        <!-- Satır 5 -->
        <button type="button" class="key key-num key-zero" id="key-0" data-num="0">0</button>
        <button type="button" class="key key-num" id="key-decimal" data-action="decimal">.</button>
        <button type="button" class="key key-equals" id="key-equals" data-action="calculate" title="Sonuç">=</button>
      </div>

      <!-- Kısayol Bilgilendirmesi -->
      <footer class="calculator-footer">
        <span>⌨️ Klavye desteği aktiftir (NumPad &amp; Enter)</span>
      </footer>
    </section>

    <!-- Geçmiş Çekmecesi -->
    <aside class="history-drawer" id="history-drawer">
      <div class="history-header">
        <h2>İşlem Geçmişi</h2>
        <button id="clear-history-btn" class="text-btn">Temizle</button>
      </div>
      <div class="history-list" id="history-list">
        <p class="history-empty">Henüz kaydedilmiş işlem yok.</p>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
